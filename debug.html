<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公平事务所 - 调试面板</title>
    <style>
body {
    font-family: 'Courier New', monospace;
    background: #0d1117;
    color: #c9d1d9;
    padding: 20px;
}
h1 {
    color: #58a6ff;
    border-bottom: 2px solid #30363d;
    padding-bottom: 10px;
}
.section {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 15px;
    margin: 15px 0;
}
.section h2 {
    color: #f0883e;
    margin-top: 0;
    font-size: 14px;
}
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 8px;
}
.item {
    background: #0d1117;
    padding: 8px 12px;
    border-radius: 4px;
    display: flex;
    justify-content: space-between;
}
.label {
    color: #8b949e;
}
.value {
    color: #58a6ff;
    font-weight: bold;
}
.char-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 10px;
}
.char-card {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 12px;
}
.char-name {
    color: #f0883e;
    font-weight: bold;
    margin-bottom: 8px;
}
.char-stat {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
    font-size: 13px;
}
.buff-list {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid #30363d;
}
.buff-tag {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 3px;
    margin: 2px;
    font-size: 11px;
}
.buff-positive {
    background: rgba(63, 185, 80, 0.2);
    color: #3fb950;
}
.buff-negative {
    background: rgba(248, 81, 73, 0.2);
    color: #f85149;
}
.json-box {
    background: #0d1117;
    padding: 12px;
    border-radius: 4px;
    font-size: 11px;
    max-height: 300px;
    overflow: auto;
    white-space: pre-wrap;
    color: #8b949e;
}
.btn {
    background: #238636;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    margin: 10px 5px 10px 0;
}
.btn:hover {
    background: #2ea043;
}
.btn-refresh {
    background: #1f6feb;
}
.btn-refresh:hover {
    background: #388bfd;
}
.warning {
    background: rgba(248, 81, 73, 0.1);
    border: 1px solid #f85149;
    color: #f85149;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 15px;
}
.game-link {
    color: #58a6ff;
    text-decoration: underline;
    margin-bottom: 15px;
    display: inline-block;
}
    </style>
</head>
<body>
    <a class="game-link" href="game.html">← 返回游戏</a>
    <div class="warning">⚠️ 调试面板 - 仅供开发测试使用</div>

    <button class="btn btn-refresh" onclick="refreshData()">🔄 刷新数据</button>
    <button class="btn" onclick="autoRefresh()">🔁 自动刷新 (5秒)</button>
    <button class="btn" onclick="stopAutoRefresh()">⏹ 停止自动刷新</button>

    <div class="section">
        <h2>📊 核心数值</h2>
        <div class="grid" id="core-grid"></div>
    </div>

    <div class="section">
        <h2>👥 团队状态</h2>
        <div class="char-grid" id="char-grid"></div>
    </div>

    <div class="section">
        <h2>📈 进度计算</h2>
        <div class="grid" id="calc-grid"></div>
    </div>

    <div class="section">
        <h2>🎯 当前阶段权重</h2>
        <div class="grid" id="weight-grid"></div>
    </div>

    <div class="section">
        <h2>💾 GameState JSON</h2>
        <div class="json-box" id="json-box"></div>
    </div>

    <script src="js/game.js"></script>
    <script>
let autoRefreshInterval = null;

function getCurrentPhaseDebug(progress) {
    const phases = weightsData?.phases || [];
    for (const phase of phases) {
        if (progress >= phase.min_progress && progress < phase.max_progress) {
            return phase;
        }
    }
    return phases[phases.length - 1] || { weights: {} };
}

function getCharEfficiency(gs, charId) {
    const favor = gs.favors?.[charId] || 50;
    let eff = 1;
    if (favor > 80) eff += Math.random() * 0.95 + 0.05;
    const buffs = gs.characterBuffs?.[charId] || [];
    buffs.forEach(b => {
        if (b.buffId === 'efficiency_boost') eff += 0.05;
    });
    return eff.toFixed(2) + 'x';
}

function calculateWeightedEfficiencyDebug(phase) {
    let weightedSum = 0;
    let totalWeight = 0;

    data.characters.characters.forEach(character => {
        const characterId = character.id;
        const baseWeight = phase.weights[characterId] || 0.1;
        const favor = gameState.favors[characterId] || 50;

        let efficiency = 1;
        if (favor > weightsData.efficiency_buff.threshold) {
            const min = weightsData.efficiency_buff.min_bonus || 0.05;
            const max = weightsData.efficiency_buff.max_bonus || 1.0;
            efficiency = 1 + Math.random() * (max - min) + min;
        }

        const characterBuffs = gameState.characterBuffs[characterId] || [];
        characterBuffs.forEach(buff => {
            const buffData = buffsData.buffs.find(b => b.id === buff.buffId);
            if (buffData && buffData.effect.type === 'progress') {
                efficiency += buffData.effect.value;
            }
        });

        weightedSum += efficiency * baseWeight;
        totalWeight += baseWeight;
    });

    return { weightedSum, totalWeight };
}

function refreshData() {
    if (!window.gameState) {
        alert('游戏未初始化，请先打开 game.html 开始游戏');
        return;
    }

    const gs = window.gameState;
    const phase = getCurrentPhaseDebug(gs.progress || 0);

    document.getElementById('core-grid').innerHTML = `
        <div class="item"><span class="label">项目进度</span><span class="value">${(gs.progress || 0).toFixed(2)}%</span></div>
        <div class="item"><span class="label">当前阶段</span><span class="value">${phase.name || '-'}</span></div>
        <div class="item"><span class="label">阶段代码</span><span class="value">${phase.code || '-'}</span></div>
        <div class="item"><span class="label">现金流</span><span class="value">${gs.cash || 0}</span></div>
        <div class="item"><span class="label">满意度</span><span class="value">${gs.satisfaction || 0}%</span></div>
        <div class="item"><span class="label">当前周数</span><span class="value">${gs.week || 0}</span></div>
        <div class="item"><span class="label">游戏状态</span><span class="value">${gs.status || '-'}</span></div>
        <div class="item"><span class="label">低满意度周</span><span class="value">${gs.lowSatisfactionWeeks || 0}</span></div>
        <div class="item"><span class="label">历史评分</span><span class="value">${gs.historyScore || 0}</span></div>
    `;

    const characters = [
        { id: 'aisaike', name: '艾萨克', role: 'RD' },
        { id: 'moganna', name: '莫甘娜', role: 'QA' },
        { id: 'xiaokui', name: '小葵', role: '设计' },
        { id: 'chenyu', name: '陈宇', role: '运营' },
        { id: 'liyue', name: '李悦', role: '产品' },
        { id: 'zhangwei', name: '张伟', role: '测试' }
    ];

    let charHtml = '';
    characters.forEach(c => {
        const favor = gs.favors?.[c.id] || 50;
        const buffs = gs.characterBuffs?.[c.id] || [];
        const buffTags = buffs.map(b => {
            const type = b.type === 'positive' ? 'buff-positive' : 'buff-negative';
            return `<span class="buff-tag ${type}">${b.name || b.buffId}</span>`;
        }).join('') || '<span style="color:#484f58">无</span>';

        charHtml += `
            <div class="char-card">
                <div class="char-name">${c.name} (${c.role})</div>
                <div class="char-stat"><span>好感度</span><span>${favor}%</span></div>
                <div class="char-stat"><span>效率</span><span>${getCharEfficiency(gs, c.id)}</span></div>
                <div class="buff-list">Buff: ${buffTags}</div>
            </div>
        `;
    });
    document.getElementById('char-grid').innerHTML = charHtml;

    const { weightedSum, totalWeight } = calculateWeightedEfficiencyDebug(phase);
    const avgEff = totalWeight > 0 ? (weightedSum / totalWeight).toFixed(4) : '1.0000';
    document.getElementById('calc-grid').innerHTML = `
        <div class="item"><span class="label">基础进度</span><span class="value">5%</span></div>
        <div class="item"><span class="label">加权效率和</span><span class="value">${weightedSum.toFixed(4)}</span></div>
        <div class="item"><span class="label">总权重</span><span class="value">${totalWeight.toFixed(4)}</span></div>
        <div class="item"><span class="label">平均效率</span><span class="value">${avgEff}</span></div>
        <div class="item"><span class="label">本周进度</span><span class="value">${(5 * avgEff).toFixed(2)}%</span></div>
    `;

    let weightHtml = '';
    for (const [id, w] of Object.entries(phase.weights || {})) {
        const char = characters.find(c => c.id === id);
        weightHtml += `<div class="item"><span class="label">${char ? char.name : id}</span><span class="value">${w}</span></div>`;
    }
    document.getElementById('weight-grid').innerHTML = weightHtml;

    document.getElementById('json-box').textContent = JSON.stringify(gs, null, 2);
}

function autoRefresh() {
    if (autoRefreshInterval) clearInterval(autoRefreshInterval);
    autoRefreshInterval = setInterval(refreshData, 5000);
    refreshData();
}

function stopAutoRefresh() {
    if (autoRefreshInterval) {
        clearInterval(autoRefreshInterval);
        autoRefreshInterval = null;
    }
}

refreshData();
    </script>
</body>
</html>
