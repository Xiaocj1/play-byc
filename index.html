<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公平事务所 - 主菜单</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/modals.css">
    <style>
        .bgm-toggle-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #ffd700;
            padding: 12px;
            cursor: pointer;
            font-size: 20px;
            color: #ffd700;
            transition: all 0.3s;
            z-index: 1000;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bgm-toggle-btn:hover {
            background: rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .museum-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            z-index: 10015;
            justify-content: center;
            align-items: center;
        }
        .museum-content {
            display: flex;
            flex-direction: column;
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            border: 4px solid;
            border-image: linear-gradient(145deg, #ffd700, #ff8c00, #ffd700) 1;
            box-shadow: 
                0 0 30px rgba(255, 215, 0, 0.3),
                0 0 60px rgba(255, 140, 0, 0.2),
                inset 0 0 60px rgba(0, 0, 0, 0.5);
            padding: 35px;
            max-width: 1100px;
            width: 95%;
            max-height: 88vh;
            overflow-y: auto;
            position: relative;
            border-radius: 12px;
        }
        .museum-content::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, transparent, rgba(255,215,0,0.1), transparent);
            pointer-events: none;
            border-radius: 14px;
        }
        .museum-close {
            position: absolute;
            top: 12px; right: 12px;
            background: linear-gradient(145deg, #ff4444, #cc0000);
            border: none;
            color: white;
            width: 38px; height: 38px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50%;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255, 68, 68, 0.4);
        }
        .museum-close:hover {
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 6px 25px rgba(255, 68, 68, 0.6);
        }
        .museum-title {
            color: #ffd700;
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            text-shadow: 
                0 0 10px rgba(255, 215, 0, 0.8),
                0 0 20px rgba(255, 140, 0, 0.5),
                2px 2px 0 #8B4513;
            letter-spacing: 3px;
        }
        .museum-tabs {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
            padding-bottom: 25px;
            border-bottom: 3px solid;
            border-image: linear-gradient(90deg, transparent, #ffd700, transparent) 1;
        }
        .museum-tab-row {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .filter-label {
            color: #00bfff;
            font-size: 12px;
            font-weight: bold;
            flex-shrink: 0;
            text-shadow: 0 0 10px rgba(0, 191, 255, 0.5);
            min-width: 60px;
        }
        .museum-tab-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .museum-tab {
            font-family: 'Press Start 2P', monospace;
            background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
            color: #aaa;
            border: 2px solid #555;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 10px;
            transition: all 0.3s;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }
        .museum-tab::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,215,0,0.2), transparent);
            transition: left 0.5s;
        }
        .museum-tab:hover::before {
            left: 100%;
        }
        .museum-tab:hover {
            color: #fff;
            border-color: #888;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }
        .museum-tab.active {
            color: #ffd700;
            border-color: #ffd700;
            background: linear-gradient(145deg, rgba(255,215,0,0.15), rgba(255,140,0,0.1));
            box-shadow: 
                0 0 20px rgba(255, 215, 0, 0.3),
                inset 0 0 20px rgba(255, 215, 0, 0.1);
        }
        .museum-tab.active::after {
            content: '◆';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: #ffd700;
        }
        .museum-tab.small {
            font-size: 9px;
            padding: 9px 16px;
        }
        .museum-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 18px;
        }
        .museum-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
            border: 3px solid #333;
            padding: 22px 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }
        .museum-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
        }
        .museum-card:hover::before {
            opacity: 1;
        }
        .museum-card:hover {
            border-color: #00ff41;
            box-shadow: 
                0 0 30px rgba(0, 255, 65, 0.4),
                0 0 60px rgba(0, 255, 65, 0.2),
                inset 0 0 30px rgba(0, 255, 65, 0.1);
            transform: translateY(-8px) scale(1.02);
        }
        .museum-card.locked {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(80%);
        }
        .museum-card.locked:hover {
            border-color: #555;
            box-shadow: none;
            transform: none;
        }
        .museum-card-icon {
            font-size: 48px;
            margin-bottom: 14px;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
        }
        .museum-card-name {
            color: #00ff41;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }
        .museum-card-subname {
            color: #999;
            font-size: 9px;
            margin-bottom: 10px;
        }
        .museum-card-condition {
            color: #666;
            font-size: 8px;
            font-style: italic;
        }
        .museum-card-type {
            display: inline-block;
            font-size: 8px;
            padding: 3px 8px;
            margin-top: 6px;
            border: 1px solid;
            border-radius: 4px;
            font-weight: bold;
        }
        .museum-card-type.victory { color: #00ff41; border-color: #00ff41; background: rgba(0,255,65,0.1); }
        .museum-card-type.failure { color: #ff4444; border-color: #ff4444; background: rgba(255,68,68,0.1); }
        .museum-card-direction {
            display: inline-block;
            font-size: 7px;
            padding: 3px 8px;
            margin-top: 6px;
            margin-left: 5px;
            border: 1px solid #444;
            color: #888;
            border-radius: 4px;
        }
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            color: #666;
            font-size: 14px;
            padding: 60px;
        }
        .museum-card-type.success { color: #00ff41; border-color: #00ff41; background: rgba(0,255,65,0.1); }
        .museum-card-type.failed { color: #ff4444; border-color: #ff4444; background: rgba(255,68,68,0.1); }
        .tag.success { color: #00ff41; border-color: #00ff41; background: rgba(0,255,65,0.1); }
        .tag.failure { color: #ff4444; border-color: #ff4444; background: rgba(255,68,68,0.1); }
        .tag.victory { color: #00ff41; border-color: #00ff41; background: rgba(0,255,65,0.1); }
        .museum-detail-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(10px);
            z-index: 10020;
            justify-content: center;
            align-items: center;
        }
        .museum-detail-content {
            display: flex;
            flex-direction: column;
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            border: 4px solid;
            border-image: linear-gradient(145deg, #ffd700, #ff8c00, #ffd700) 1;
            box-shadow: 
                0 0 40px rgba(255, 215, 0, 0.4),
                0 0 80px rgba(255, 140, 0, 0.3),
                inset 0 0 80px rgba(0, 0, 0, 0.6);
            padding: 45px;
            max-width: 650px;
            width: 95%;
            max-height: 88vh;
            overflow-y: auto;
            position: relative;
            border-radius: 14px;
        }
        .museum-detail-close {
            position: absolute;
            top: 12px; right: 12px;
            background: linear-gradient(145deg, #ff4444, #cc0000);
            border: none;
            color: white;
            width: 40px; height: 40px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50%;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255, 68, 68, 0.4);
        }
        .museum-detail-close:hover {
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 6px 25px rgba(255, 68, 68, 0.6);
        }
        .museum-detail-header {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 3px solid;
            border-image: linear-gradient(90deg, transparent, #ffd700, transparent) 1;
        }
        .museum-detail-icon { 
            font-size: 72px;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.4));
        }
        .museum-detail-title h2 {
            color: #ffd700;
            font-size: 22px;
            margin: 0 0 12px 0;
            text-shadow: 
                0 0 10px rgba(255, 215, 0, 0.8),
                0 0 20px rgba(255, 140, 0, 0.5);
        }
        .museum-detail-subname {
            color: #999;
            font-size: 11px;
            font-style: italic;
            margin-bottom: 10px;
        }
        .museum-detail-tags {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .tag {
            display: inline-block;
            font-size: 10px;
            padding: 4px 12px;
            border: 1px solid;
            color: #888;
            border-radius: 6px;
            font-weight: bold;
        }
        .museum-detail-section {
            margin-bottom: 28px;
            padding: 20px;
            background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            border-radius: 10px;
            border-left: 4px solid #00bfff;
        }
        .museum-detail-section h3 {
            color: #00bfff;
            font-size: 13px;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(0, 191, 255, 0.5);
        }
        .museum-detail-section blockquote {
            color: #eee;
            font-size: 12px;
            margin: 0 0 10px 0;
            padding-left: 18px;
            border-left: 3px solid #00ff41;
            line-height: 1.6;
        }
        .museum-detail-section cite {
            color: #777;
            font-size: 10px;
            font-style: italic;
            display: block;
            margin-top: 8px;
        }
        .museum-detail-unlock {
            margin-top: 35px;
            padding-top: 25px;
            border-top: 3px solid;
            border-image: linear-gradient(90deg, transparent, #ffd700, transparent) 1;
        }
        .museum-detail-unlock h3 {
            color: #ffd700;
            font-size: 13px;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        .museum-detail-unlock p {
            color: #bbb;
            font-size: 11px;
            line-height: 1.7;
            font-style: italic;
        }
        
        /* 滚动条样式 */
        .museum-content::-webkit-scrollbar,
        .museum-detail-content::-webkit-scrollbar {
            width: 10px;
        }
        .museum-content::-webkit-scrollbar-track,
        .museum-detail-content::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.3);
            border-radius: 5px;
        }
        .museum-content::-webkit-scrollbar-thumb,
        .museum-detail-content::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #ffd700, #ff8c00);
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        .museum-content::-webkit-scrollbar-thumb:hover,
        .museum-detail-content::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #ffed4a, #ffd700);
        }
        
        /* 动画效果 */
        @keyframes cardGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 65, 0.3); }
            50% { box-shadow: 0 0 30px rgba(0, 255, 65, 0.5); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .museum-card {
            animation: fadeIn 0.5s ease-out;
        }
        
        .museum-card:hover {
            animation: cardGlow 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="crt-effect"></div>
    <div class="scanline"></div>
    <div class="crt-noise"></div>
    <div class="crt-flicker"></div>

    <div class="main-menu">
        <div class="menu-background"></div>
        
        <header class="logo-section">
            <h1 class="logo-title">公平事务所</h1>
            <p class="logo-subtitle">Fairness Studio</p>
        </header>

        <main class="buttons-section">
            <button class="pixel-btn btn-start-game" id="btn-start">
                <span class="btn-icon">▶</span>
                <span class="btn-text">开始游戏</span>
            </button>

            <div class="secondary-buttons">
                <button class="pixel-btn btn-secondary" id="btn-levelup">
                    <span class="btn-icon">🔥</span>
                    <span class="btn-text">卷一卷</span>
                </button>
                <button class="pixel-btn btn-secondary" id="btn-gallery">
                    <span class="btn-icon">🃏</span>
                    <span class="btn-text">人才库</span>
                </button>
                <button class="pixel-btn btn-secondary" id="btn-museum">
                    <span class="btn-icon">🏛️</span>
                    <span class="btn-text">陈列馆</span>
                </button>
                <button class="pixel-btn btn-secondary" id="btn-toolchain">
                    <span class="btn-icon">⚙️</span>
                    <span class="btn-text">工具链</span>
                </button>
            </div>

            <button class="pixel-btn btn-continue" id="btn-continue" style="display: none;">
                <span class="btn-icon">▸</span>
                <span class="btn-text">继续游戏</span>
            </button>

            <div class="current-tools-display" id="current-tools-display" style="display: none;">
                当前工具链：<span id="current-tools-names">未选择</span>
            </div>
        </main>

        <button class="bgm-toggle-btn" id="btn-bgm-toggle">🔊</button>

        <div class="rank-badge" id="rank-badge">
            <div class="rank-label">当前职级</div>
            <div class="rank-value">P5</div>
            <div class="rank-bars">
                <div class="rank-bar">
                    <span class="bar-label">人脉</span>
                    <span class="bar-value">1-1</span>
                </div>
                <div class="rank-bar">
                    <span class="bar-label">技术</span>
                    <span class="bar-value">1-1</span>
                </div>
                <div class="rank-bar">
                    <span class="bar-label">资源</span>
                    <span class="bar-value">1-1</span>
                </div>
            </div>
            <div class="prestige-info">
                <span class="prestige-label">项目经历</span>
                <span class="prestige-value">0</span>
                <span class="prestige-divider">/</span>
                <span class="prestige-next">2</span>
                <span class="prestige-hint">（P6还需2）</span>
            </div>
        </div>
    </div>

    <div class="confirm-modal" id="confirm-modal">
        <div class="confirm-content">
            <p class="confirm-message" id="confirm-message"></p>
            <div class="confirm-buttons">
                <button class="pixel-btn confirm-ok" id="confirm-ok">确定</button>
                <button class="pixel-btn confirm-cancel" id="confirm-cancel">取消</button>
            </div>
        </div>
    </div>

    <div class="toast-modal" id="toast-modal">
        <div class="toast-content">
            <p class="toast-message" id="toast-message"></p>
        </div>
    </div>

    <div class="levelup-modal" id="levelup-modal">
        <div class="levelup-content">
            <button class="levelup-close" onclick="closeLevelupModal()">X</button>
            <h2 class="levelup-title">🔥 职级晋升</h2>
            <div class="levelup-experience">
                <span class="levelup-exp-label">当前项目经历：</span>
                <span class="levelup-exp-value" id="levelup-exp-value">0</span>
            </div>
            <div class="levelup-list" id="levelup-list"></div>
        </div>
    </div>

    <div class="gallery-modal" id="gallery-modal">
        <div class="gallery-content">
            <button class="gallery-close" onclick="closeGalleryModal()">X</button>
            <div class="gallery-scroll-container">
                <h2 class="gallery-title">🃏 人才库</h2>
                <div class="gallery-grid" id="gallery-grid"></div>
            </div>
        </div>
    </div>

    <div class="toolchain-modal" id="toolchain-modal">
        <div class="toolchain-content">
            <button class="toolchain-close" onclick="closeToolchainModal()">X</button>
            <h2 class="toolchain-title">⚙️ 自定义工具链</h2>

            <div class="toolchain-tabs" id="toolchain-tabs"></div>
            <div id="toolchain-categories"></div>

            <div class="toolchain-summary">
                <div class="toolchain-budget">
                    初始预算：<span id="base-budget">100</span>
                    → 调整后：<span id="adjusted-budget" class="budget-change">100</span>
                </div>
                <div class="toolchain-effects-summary" id="toolchain-effects-summary">
                    选择工具后将显示效果汇总
                </div>
                <button class="toolchain-confirm" id="toolchain-confirm">确认选择</button>
                <button class="toolchain-cancel" onclick="closeToolchainModal()">取消</button>
            </div>
        </div>
    </div>

    <div class="museum-modal" id="museum-modal">
        <div class="museum-content">
            <button class="museum-close" onclick="closeMuseumModal()">X</button>
            <div class="museum-scroll-container">
                <h2 class="museum-title">🏛️ 产品陈列馆</h2>
                <div class="museum-tabs" id="museum-tabs"></div>
                <div class="museum-grid" id="museum-grid"></div>
            </div>
        </div>
    </div>

    <div class="museum-detail-modal" id="museum-detail-modal">
        <div class="museum-detail-content" id="museum-detail-content">
        </div>
    </div>

    <script src="js/gallery.js"></script>
    <script src="js/museum.js"></script>
    <script src="js/home.js"></script>
    
    <audio id="bgm-player" loop>
        <source src="assets/background/index.mp3" type="audio/mpeg">
    
    
    <script>
        const bgmPlayer = document.getElementById('bgm-player');
        const bgmButton = document.getElementById('btn-bgm-toggle');
        let bgmEnabled = false;
        
        function toggleBGM() {
            bgmEnabled = !bgmEnabled;
            if (bgmEnabled) {
                bgmPlayer.volume = 0.3;
                bgmPlayer.play().catch(() => {});
                bgmButton.textContent = '🔊';
            } else {
                bgmPlayer.pause();
                bgmButton.textContent = '🔇';
            }
        }
        
        bgmButton.addEventListener('click', toggleBGM);
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleBGM();
            }
        });
    </script>
</body>
</html>
