<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公平事务所 - 选择创业方向</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/home.css">
    <style>
        body {
            overflow: hidden;
        }
        .select-page {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            z-index: 99999;
            display: none;
        }
        .story-modal {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .story-content {
            background: linear-gradient(180deg, #1a1a2e 0%, #0a0a0f 100%);
            border: 3px solid #ffd700;
            padding: 25px;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.3);
        }
        .story-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            color: #ffd700;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ffd700;
        }
        .story-text {
            font-size: 12px;
            color: #e5e5e5;
            line-height: 1.8;
            white-space: pre-line;
            margin-bottom: 20px;
        }
        .story-button {
            display: block;
            width: 100%;
            padding: 12px;
            font-size: 12px;
            color: #000;
            background: linear-gradient(180deg, #ffd700 0%, #b8860b 100%);
            border: none;
            cursor: pointer;
            font-family: 'Press Start 2P', monospace;
            transition: all 0.3s;
        }
        .story-button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        .story-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            color: #888;
            cursor: pointer;
            transition: color 0.3s;
        }
        .story-close:hover {
            color: #ffd700;
        }
        .select-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 24px;
            color: #ffd700;
            text-shadow: 0 0 20px #ffd700, 0 0 40px #ffd700;
            margin-bottom: 60px;
            text-align: center;
            animation: titleGlow 2s ease-in-out infinite;
        }
        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 20px #ffd700, 0 0 40px #ffd700; }
            50% { text-shadow: 0 0 30px #ffd700, 0 0 60px #ffd700, 0 0 80px #ffd700; }
        }
        .select-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            max-width: 1000px;
            padding: 0 20px;
        }
        .select-card {
            background: rgba(0, 0, 0, 0.7);
            border: 4px solid #333;
            padding: 40px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .select-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .select-card:hover {
            border-color: #ffd700;
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(255, 215, 0, 0.2);
        }
        .select-card:hover::before {
            opacity: 1;
        }
        .select-card-icon {
            font-size: 80px;
            margin-bottom: 25px;
        }
        .select-card-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 20px;
            color: #00ff41;
            margin-bottom: 15px;
        }
        .select-card-desc {
            font-size: 12px;
            color: #fff;
            margin-bottom: 20px;
            line-height: 1.8;
        }
        .select-card-detail {
            font-size: 10px;
            color: #888;
            line-height: 1.6;
        }
        .select-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .select-card.locked:hover {
            border-color: #333;
            transform: none;
            box-shadow: none;
        }
        .bgm-toggle-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #ffd700;
            padding: 12px;
            cursor: pointer;
            font-size: 20px;
            color: #ffd700;
            transition: all 0.3s;
            z-index: 1000;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bgm-toggle-btn:hover {
            background: rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        .bgm-icon {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="crt-effect"></div>
    <div class="scanline"></div>
    
    <div class="story-modal" id="story-modal">
        <div class="story-content">
            <div class="story-close" onclick="closeStoryModal()">×</div>
            <h2 class="story-title" id="story-title">📝 创始人手记</h2>
            <div class="story-text" id="story-text"></div>
            <button class="story-button" id="story-button" onclick="handleStoryChoice()">开始创业</button>
        </div>
    </div>

    <div class="select-page" id="select-page">
        <h1 class="select-title">🚀 选择你的创业方向</h1>
        <div class="select-cards">
            <div class="select-card" onclick="selectDirection('tob')">
                <div class="select-card-icon">💼</div>
                <h2 class="select-card-title">To B</h2>
                <p class="select-card-desc">服务企业，稳扎稳打</p>
                <p class="select-card-detail">承接甲方项目<br>做定制开发<br>被大厂收购 / 成为头部服务商</p>
            </div>
            <div class="select-card" onclick="selectDirection('toc')">
                <div class="select-card-icon">📱</div>
                <h2 class="select-card-title">To C</h2>
                <p class="select-card-desc">做产品，赌一个爆款</p>
                <p class="select-card-detail">打造独立App<br>服务普通用户<br>App爆火 / 公司上市</p>
            </div>
            <div class="select-card" onclick="selectDirection('b2c')">
                <div class="select-card-icon">🌐</div>
                <h2 class="select-card-title">B2C</h2>
                <p class="select-card-desc">做平台，赚抽成</p>
                <p class="select-card-detail">连接服务商与用户<br>双边市场<br>平台垄断 / 成为行业标准</p>
            </div>
        </div>

        <button class="bgm-toggle-btn" id="btn-bgm-toggle">�</button>
    </div>

    <script>
        const STORAGE_KEY = "fair_office_game_state";
        const STORY_KEY = "fair_office_story_state";
        const TOOLCHAIN_KEY = "fair_office_toolchain";
        let storiesData = null;
        let toolchainData = null;
        let currentStory = 'opening';
        let currentDirection = null;

        async function loadStories() {
            try {
                const [stories, toolchain] = await Promise.all([
                    fetch('data/stories.json').then(r => r.json()),
                    fetch('data/toolchain.json').then(r => r.json())
                ]);
                storiesData = stories;
                toolchainData = toolchain;
                checkStoryProgress();
            } catch (error) {
                console.error('Failed to load data:', error);
                showSelectPage();
            }
        }

        function checkStoryProgress() {
            const saved = localStorage.getItem(STORY_KEY);
            if (!saved || saved === 'opening') {
                showOpeningStory();
            } else {
                showSelectPage();
            }
        }

        function showOpeningStory() {
            const story = storiesData.founder_notes.opening;
            document.getElementById('story-title').textContent = story.title;
            document.getElementById('story-text').textContent = story.content;
            document.getElementById('story-button').textContent = story.choices[0].text;
            document.getElementById('story-modal').style.display = 'flex';
            document.getElementById('select-page').style.display = 'none';
        }

        function handleStoryChoice() {
            if (currentStory === 'opening') {
                localStorage.setItem(STORY_KEY, 'opening_done');
                closeStoryModal();
                showSelectPage();
            }
        }

        function closeStoryModal() {
            document.getElementById('story-modal').style.display = 'none';
            document.getElementById('select-page').style.display = 'flex';
        }

        function showSelectPage() {
            document.getElementById('story-modal').style.display = 'none';
            document.getElementById('select-page').style.display = 'flex';
        }

        function selectDirection(direction) {
            currentDirection = direction;
            
            const story = storiesData.founder_notes.direction_intro[direction];
            if (story) {
                document.getElementById('story-title').textContent = story.title;
                document.getElementById('story-text').textContent = story.content;
                document.getElementById('story-button').textContent = '确认选择';
                currentStory = 'direction';
                document.getElementById('story-modal').style.display = 'flex';
                document.getElementById('select-page').style.display = 'none';
            } else {
                startGame(direction);
            }
        }

        function selectToolchain(direction) {
            const availableToolchains = toolchainData.direction_default[direction];
            if (!availableToolchains || availableToolchains.length === 0) {
                return 'feishu';
            }
            
            const randomIndex = Math.floor(Math.random() * availableToolchains.length);
            return availableToolchains[randomIndex];
        }

        function startGame(direction) {
            localStorage.removeItem(STORY_KEY);

            const saved = localStorage.getItem(STORAGE_KEY);
            let gameState;
            
            if (saved) {
                gameState = JSON.parse(saved);
            } else {
                gameState = {
                    week: 1,
                    prdVersion: "V1.0.0",
                    favors: {},
                    progress: 0,
                    satisfaction: 80,
                    satisfactionHistory: [80],
                    consecutiveLowSatisfactionWeeks: 0,
                    prdHistory: [],
                    weeklyLogs: [],
                    currentEventIndex: 0,
                    gameOver: false,
                    budget: 100,
                    toolchain: {},
                    characterBuffs: {},
                    quarterlyQuests: [],
                    quarterlyScore: 0,
                    fame: 50,
                    debt: 0,
                    debtLimit: 100,
                    okrBonus: 0,
                    financingRound: 0,
                    financingDebt: 0,
                    consecutiveProfitableQuarters: 0,
                    totalAssets: 0,
                    dau: 0,
                    ltv: 2,
                    gmv: 0,
                    commissionRate: 5,
                    disputeRate: 5,
                    benchmarkClients: 0,
                    renewalRate: 70,
                    toBPhase: 0,
                    declinedIPO: false,
                    triggerAcquisition: false
                };
            }
            
            gameState.direction = direction;
            
            const toolchainId = selectToolchain(direction);
            gameState.toolchain = toolchainData.toolchains[toolchainId];
            localStorage.setItem(TOOLCHAIN_KEY, toolchainId);
            
            localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
            
            window.location.href = 'game.html';
        }

        document.getElementById('story-button').addEventListener('click', function() {
            if (currentStory === 'direction' && currentDirection) {
                startGame(currentDirection);
            } else {
                handleStoryChoice();
            }
        });

        window.addEventListener('DOMContentLoaded', loadStories);
    </script>
    
    <audio id="bgm-player" loop>
        <source src="assets/background/index.mp3" type="audio/mpeg">
    
    
    <script>
        const bgmPlayer = document.getElementById('bgm-player');
        const bgmButton = document.getElementById('btn-bgm-toggle');
        let bgmEnabled = false;
        
        function toggleBGM() {
            bgmEnabled = !bgmEnabled;
            if (bgmEnabled) {
                bgmPlayer.volume = 0.3;
                bgmPlayer.play().catch(() => {});
                bgmButton.textContent = '🔊';
            } else {
                bgmPlayer.pause();
                bgmButton.textContent = '🔇';
            }
        }
        
        bgmButton.addEventListener('click', toggleBGM);
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleBGM();
            }
        });
    </script>
</body>
</html>
